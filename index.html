<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vault Access Panel</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial, Helvetica, sans-serif;
background: radial-gradient(circle at center, #555 0%, #2b2b2b 40%, #111 100%);
}

/* Vault panel */

.vault{
background: linear-gradient(145deg,#9a9a9a,#5f5f5f);
border:8px solid #2f2f2f;
border-radius:12px;
width:420px;
padding:30px;
box-shadow:
inset 0 0 20px rgba(0,0,0,0.8),
0 10px 25px rgba(0,0,0,0.8);
position:relative;
}

/* Bolts */

.vault::before, .vault::after{
content:"";
position:absolute;
width:18px;
height:18px;
background:radial-gradient(circle,#ddd,#555);
border-radius:50%;
box-shadow: inset 0 0 5px black;
}

.vault::before{
top:10px;
left:10px;
}

.vault::after{
bottom:10px;
right:10px;
}

/* Title */

h1{
text-align:center;
color:#111;
text-shadow:1px 1px #ccc;
margin-bottom:25px;
}

/* Inputs */

select, input{
width:100%;
margin-bottom:10px;
padding:10px;
border-radius:4px;
border:2px solid #333;
background:#cfcfcf;
font-weight:bold;
box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:5px;
background:linear-gradient(#444,#111);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
box-shadow:0 4px 8px rgba(0,0,0,0.6);
}

button:hover{
background:linear-gradient(#666,#222);
}

/* Hidden message */

#secret{
margin-top:20px;
padding:15px;
background:#0a0a0a;
color:#00ff9d;
border:2px solid #333;
display:none;
font-family:monospace;
}

#error{
margin-top:10px;
color:#ff4444;
text-align:center;
display:none;
}

</style>

</head>

<body>

<div class="vault">

<h1>VAULT ACCESS</h1>

<select id="c1">
<option>Red</option>
<option>Blue</option>
<option>Yellow</option>
</select>

<select id="c2">
<option>Red</option>
<option>Blue</option>
<option>Yellow</option>
</select>

<select id="c3">
<option>Red</option>
<option>Blue</option>
<option>Yellow</option>
</select>

<select id="c4">
<option>Red</option>
<option>Blue</option>
<option>Yellow</option>
</select>

<select id="c5">
<option>Red</option>
<option>Blue</option>
<option>Yellow</option>
</select>

<select id="c6">
<option>Red</option>
<option>Blue</option>
<option>Yellow</option>
</select>

<input id="number" type="text" maxlength="4" placeholder="Enter 4 digit code">

<button onclick="checkCode()">Unlock Vault</button>

<div id="error">ACCESS DENIED</div>

<div id="secret">
ACCESS GRANTED.<br><br>
Vault contents unlocked.<br>
Incomplete.
Come back later.
</div>

</div>

<script>

function checkCode(){

let colors = [
document.getElementById("c1").value,
document.getElementById("c2").value,
document.getElementById("c3").value,
document.getElementById("c4").value,
document.getElementById("c5").value,
document.getElementById("c6").value
];

let number = document.getElementById("number").value;

/* Correct combination */

let correctColors = ["Red","Blue","Yellow","Blue","Red","Yellow"];
let correctNumber = "1408";

let correct = true;

for(let i=0;i<6;i++){
if(colors[i] !== correctColors[i]){
correct = false;
}
}

if(number !== correctNumber){
correct = false;
}

if(correct){
document.getElementById("secret").style.display = "block";
document.getElementById("error").style.display = "none";
}else{
document.getElementById("error").style.display = "block";
document.getElementById("secret").style.display = "none";
}

}

</script>

</body>
</html>
