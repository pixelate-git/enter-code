<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --bg: #0d1117;
        --panel: #111827;
        --panel-alt: #0f172a;
        --line: rgba(148, 163, 184, 0.22);
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #8ec5ff;
        --accent-2: #c4b5fd;
        --shadow: rgba(15, 23, 42, 0.8);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
      }

      .app {
        width: min(1100px, 100%);
        display: grid;
        grid-template-columns: repeat(2, minmax(260px, 1fr));
        gap: 22px;
        padding: 18px;
        border: 1px solid var(--line);
        background: rgba(17, 24, 39, 0.72);
        box-shadow: 0 18px 42px var(--shadow);
        backdrop-filter: blur(8px);
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(17, 24, 39, 0.94));
        border: 1px solid var(--line);
        padding: 18px;
      }

      .label {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      textarea {
        width: 100%;
        min-height: 180px;
        resize: vertical;
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        border-radius: 10px;
        padding: 14px 14px;
        font-size: 15px;
        line-height: 1.45;
        outline: none;
      }

      textarea:focus {
        border-color: rgba(142, 197, 255, 0.9);
        box-shadow: 0 0 0 1px rgba(142, 197, 255, 0.45);
      }

      .bar {
        display: flex;
        gap: 10px;
        margin-top: 2px;
      }

      button {
        flex: 1;
        border: 1px solid rgba(142, 197, 255, 0.3);
        background: linear-gradient(180deg, rgba(27, 38, 59, 0.9), rgba(17, 24, 39, 0.9));
        color: var(--text);
        padding: 11px 14px;
        border-radius: 9px;
        cursor: pointer;
        font-size: 14px;
        letter-spacing: 0.04em;
        transition: transform 0.12s ease, border-color 0.12s ease;
      }

      button:hover {
        transform: translateY(-1px);
        border-color: rgba(196, 181, 253, 0.8);
      }

      .copy {
        border-color: rgba(196, 181, 253, 0.3);
        background: rgba(20, 24, 38, 0.8);
      }

      @media (max-width: 760px) {
        .app {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <section class="panel">
        <div class="label">Input</div>
        <textarea id="encodeInput" placeholder="Type text to fold into the hidden form"></textarea>
        <div class="bar">
          <button id="encodeBtn">Build</button>
          <button id="copyEncode" class="copy">Copy</button>
        </div>
        <div class="label">Output</div>
        <textarea id="encodeOutput" readonly placeholder="Hidden result appears here"></textarea>
      </section>

      <section class="panel">
        <div class="label">Input</div>
        <textarea id="decodeInput" placeholder="Paste hidden text to restore it"></textarea>
        <div class="bar">
          <button id="decodeBtn">Reveal</button>
          <button id="copyDecode" class="copy">Copy</button>
        </div>
        <div class="label">Output</div>
        <textarea id="decodeOutput" readonly placeholder="Original text appears here"></textarea>
      </section>
    </div>

    <script>
      const alphabet = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!#$%&()*+,-./:;=?@[]^_{}~';
      const lookup = Object.fromEntries([...alphabet].map((ch, index) => [ch, index]));

      function encodeByte(value) {
        const first = Math.floor(value / 94);
        const second = value % 94;
        return alphabet[first] + alphabet[second];
      }

      function decodeByte(pair) {
        const a = lookup[pair[0]];
        const b = lookup[pair[1]];
        return a * 94 + b;
      }

      function encodeText(raw) {
        if (!raw) return '';

        const chars = Array.from(raw);
        const length = chars.length || 1;

        const values = chars.map((char, index) => {
          const code = char.charCodeAt(0);
          const mask = (length * 29 + index * 13) % 256;
          const seed = ((index + 1) * 19 + length * 11) % 256;
          return ((code ^ mask) + seed) & 255;
        });

        return values.map(encodeByte).join('');
      }

      function decodeText(raw) {
        if (!raw) return '';

        const clean = raw.replace(/\s+/g, '');
        if (!clean) return '';

        let fixed = clean;
        if (fixed.length % 2 !== 0) {
          fixed = fixed.slice(0, -1);
        }

        let out = '';
        const length = Math.ceil(fixed.length / 2) || 1;

        for (let i = 0; i < fixed.length; i += 2) {
          const pair = fixed.slice(i, i + 2);
          const value = decodeByte(pair);
          const index = i / 2;
          const mask = (length * 29 + index * 13) % 256;
          const seed = ((index + 1) * 19 + length * 11) % 256;
          const code = (((value - seed) & 255) ^ mask);
          out += String.fromCharCode(code);
        }

        return out;
      }

      document.getElementById('encodeBtn').addEventListener('click', () => {
        const input = document.getElementById('encodeInput').value;
        document.getElementById('encodeOutput').value = encodeText(input);
      });

      document.getElementById('decodeBtn').addEventListener('click', () => {
        const input = document.getElementById('decodeInput').value;
        document.getElementById('decodeOutput').value = decodeText(input);
      });

      document.getElementById('copyEncode').addEventListener('click', async () => {
        const value = document.getElementById('encodeOutput').value;
        if (!value) return;
        try {
          await navigator.clipboard.writeText(value);
        } catch (error) {
          document.getElementById('encodeOutput').select();
          document.execCommand('copy');
        }
      });

      document.getElementById('copyDecode').addEventListener('click', async () => {
        const value = document.getElementById('decodeOutput').value;
        if (!value) return;
        try {
          await navigator.clipboard.writeText(value);
        } catch (error) {
          document.getElementById('decodeOutput').select();
          document.execCommand('copy');
        }
      });
    </script>
  </body>
</html>
